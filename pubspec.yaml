name: glory_gym
description: "Glory Gym Management App"
publish_to: "none"
version: 1.0.0+5

environment:
  sdk: ^3.11.1

dependencies:
  # ═══════════════════════════════════════════════════════════════
  # Flutter Core - الأساسيات | Base framework & icons
  # ═══════════════════════════════════════════════════════════════
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # ═══════════════════════════════════════════════════════════════
  # State Management & Architecture - إدارة الحالة والمعمارية
  # Bloc للـ state | HydratedBloc لحفظ الحالة | Freezed للموديلز | DI | Retrofit
  # ═══════════════════════════════════════════════════════════════
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  equatable: ^2.0.8
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  retrofit: ^4.9.2
  retrofit_generator: ^10.2.3

  # ═══════════════════════════════════════════════════════════════
  # Network - الشبكة والاتصال
  # HTTP requests | Logging | تحقق من الاتصال بالإنترنت
  # ═══════════════════════════════════════════════════════════════
  dio: ^5.9.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0
  socket_io_client: ^3.1.2

  # ═══════════════════════════════════════════════════════════════
  # Storage - التخزين المحلي
  # تخزين آمن للمفاتيح | SharedPreferences | قاعدة بيانات SQLite
  # ═══════════════════════════════════════════════════════════════
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  sqflite: ^2.4.2

  # ═══════════════════════════════════════════════════════════════
  # Firebase - فيربيس
  # Core + Push Notifications | الإشعارات الفورية
  # ═══════════════════════════════════════════════════════════════
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # ═══════════════════════════════════════════════════════════════
  # UI & Design - الواجهة والتصميم
  # Responsive | SVG | Icons | Loading | Animations | Snackbars
  # ═══════════════════════════════════════════════════════════════
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.1
  iconsax: ^0.0.8
  iconsax_flutter: ^1.0.1
  loading_indicator: ^3.1.1
  lottie: ^3.3.2
  skeletonizer: ^2.1.3
  top_snackbar_flutter: ^3.3.0
  flutter_speed_dial: ^7.0.0
  flutter_easyloading: ^3.0.5
  easy_date_timeline: ^2.0.9

  # ═══════════════════════════════════════════════════════════════
  # Images & Media - الصور والملفات
  # تحميل صور | ضغط | اختيار من المعرض أو الكاميرا أو الملفات
  # ═══════════════════════════════════════════════════════════════
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.4.0
  image_picker: ^1.2.1
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.0
  file_picker: ^10.3.10

  # ═══════════════════════════════════════════════════════════════
  # Location - الموقع
  # GPS | Geocoding (عنوان ↔ إحداثيات)
  # ═══════════════════════════════════════════════════════════════
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # ═══════════════════════════════════════════════════════════════
  # Notifications & Permissions - الإشعارات والصلاحيات
  # إشعارات محلية | طلب صلاحيات (كاميرا، موقع، إلخ)
  # ═══════════════════════════════════════════════════════════════
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.1

  # ═══════════════════════════════════════════════════════════════
  # Utils & Helpers - أدوات مساعدة
  # تواريخ | تشفير | JSON | env | مسارات | إعادة تشغيل
  # ═══════════════════════════════════════════════════════════════
  jiffy: ^6.4.4
  crypto: ^3.0.7
  json_annotation: ^4.10.0
  flutter_dotenv: ^6.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  restart_app: ^1.3.2
  go_router: ^17.2.3
  timezone: ^0.11.0

  # ═══════════════════════════════════════════════════════════════
  # User Actions - تفاعلات المستخدم
  # مشاركة | فتح روابط | حقل إدخال PIN/OTP
  # ═══════════════════════════════════════════════════════════════
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  pinput: ^6.0.2
  dotted_border: ^3.1.0
  country_flags: ^3.0.0
  qr_flutter: ^4.1.0
  screen_protector: ^1.5.2
  audioplayers: ^6.8.1
  mobile_scanner: ^7.4.0

dev_dependencies:
  # ═══════════════════════════════════════════════════════════════
  # Code Generation - توليد الكود
  # Retrofit + JSON Serializable + Freezed
  # ═══════════════════════════════════════════════════════════════
  build_runner: ^2.11.1
  json_serializable: ^6.12.0
  freezed: ^3.2.5

  # ═══════════════════════════════════════════════════════════════
  # Linting & Testing - الفحص والاختبار
  # ═══════════════════════════════════════════════════════════════
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/pngs/app_logo.png"
  image_path_ios: "assets/images/pngs/app_logo_ios.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/pngs/
    - assets/images/svgs/
    - assets/lotties/
    - assets/sounds/
